name: Egress Guard

# Defense-in-depth: fail the build if any content/PII-transmitting path is
# reintroduced, and run the enforced outbound-payload invariant tests.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  egress-guard:
    name: Egress allowlist guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static guard (no content-transmitting paths)
        run: bash scripts/egress_guard.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Enforced egress invariant tests
        run: npx vitest run tests/egress-invariant.test.ts tests/identifiers.test.ts
